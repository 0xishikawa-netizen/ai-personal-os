server:
  # Render 等は環境変数 PORT を注入する。未設定時は 8080（compose / ローカル）。
  port: ${PORT:8080}

spring:
  application:
    name: kairos

  # 既定はホスト直実行用（localhost）。Docker の api もルート .env の DB_URL（例: host.docker.internal:5432）。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ブラウザが API を直叩きするときのみ有効。Vercel の Route Handler 経由なら上流はサーバー間通信で CORS は基本不要。
# 複数ドメインはカンマ区切り（例: https://app.vercel.app,https://www.example.com）
kairos:
  cors:
    allowed-origin-patterns: ${KAIROS_CORS_ALLOWED_ORIGIN_PATTERNS:*}

langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY:}
      model-name: ${GEMINI_MODEL:gemini-2.5-flash}
