import org.gradle.jvm.toolchain.JvmVendorSpec

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
}

group = 'com.personalos'
version = '0.0.1-SNAPSHOT'
description = 'AI Personal OS (Spring Boot)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

repositories {
    mavenCentral()
}

def springBootVersion = "4.0.2"
def langchain4jVersion = "0.36.2"
def lombokVersion = "1.18.40"

dependencies {
    implementation(enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
    implementation(platform("dev.langchain4j:langchain4j-bom:${langchain4jVersion}"))

    // Web/API
    implementation "org.springframework.boot:spring-boot-starter-web"

    // JPA（不要なら削除）
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    // DB driver
    runtimeOnly "org.postgresql:postgresql"

    // LangChain4j
    implementation "dev.langchain4j:langchain4j-pgvector"
    implementation "dev.langchain4j:langchain4j-google-ai-gemini"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test') {
    useJUnitPlatform()
}
