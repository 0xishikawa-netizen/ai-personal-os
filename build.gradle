import org.gradle.jvm.toolchain.JvmVendorSpec

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
}

group = 'com.kairos'
version = '0.0.1-SNAPSHOT'
description = 'Kairos (Spring Boot)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

repositories {
    mavenCentral()
}

def springBootVersion = "4.0.2"
def langchain4jVersion = "0.36.2"
def lombokVersion = "1.18.40"

dependencies {
    implementation(enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}"))
    implementation(platform("dev.langchain4j:langchain4j-bom:${langchain4jVersion}"))

    // Web/API
    implementation "org.springframework.boot:spring-boot-starter-web"
    // Quiz 等が com.fasterxml.jackson.databind.ObjectMapper を使うため（Boot 4 既定は Jackson 3 の JsonMapper）
    implementation "org.springframework.boot:spring-boot-jackson2"

    // JPA
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    // スキーマ（クイズ用テーブルは Flyway で作成）
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    runtimeOnly "org.flywaydb:flyway-database-postgresql"

    // DB driver
    runtimeOnly "org.postgresql:postgresql"

    // LangChain4j（0.36.x BOM には Gemini 用 spring-boot-starter が無い → ChatLanguageModel は AiConfig で定義）
    implementation "dev.langchain4j:langchain4j-pgvector"
    implementation "dev.langchain4j:langchain4j-google-ai-gemini"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testRuntimeOnly "com.h2database:h2"
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.kairos.KairosApplication'
}
