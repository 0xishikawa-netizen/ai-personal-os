services:
  # 既定では起動しない。DBeaver と同じ「ホストの Postgres（例: localhost:5432）」を .env の DB_URL で使う。
  # 同梱 DB が欲しいときだけ: docker compose --profile bundled-db up -d
  db:
    profiles:
      - bundled-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build: .
    container_name: kairos-api
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - '8080:8080'
    # コンテナから Mac/Win のホスト Postgres へ（DBeaver の localhost:5432 と同じインスタンス）
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - internal

networks:
  internal:
    driver: bridge
