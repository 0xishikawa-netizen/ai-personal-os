# Render Blueprint 用（任意）。手動で Web Service を作る場合はこのファイルは不要。
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kairos-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: KAIROS_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
